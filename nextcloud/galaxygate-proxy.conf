# NextCloud builds https links when HTTPS is set. The header only changes the
# links in the response to the client that sent it, so it is honored from any
# address and no list of proxy addresses has to be kept up to date.
SetEnvIfNoCase X-Forwarded-Proto "^https\s*(,|$)" HTTPS=on

# NextCloud's .htaccess redirects the CalDAV and CardDAV discovery URLs and the
# Windows WebDAV client to relative targets. These copies of those rules run
# first and send https behind the proxy. Plain http requests fall through to
# the .htaccess rules unchanged.
<Directory /var/www/html>
    RewriteEngine On
    RewriteOptions InheritDownBefore
    RewriteCond %{ENV:HTTPS} =on
    RewriteCond %{HTTP_USER_AGENT} DavClnt
    RewriteRule ^$ https://%{HTTP_HOST}/remote.php/webdav/ [L,R=302]
    RewriteCond %{ENV:HTTPS} =on
    RewriteRule ^\.well-known/(carddav|caldav)$ https://%{HTTP_HOST}/remote.php/dav/ [R=301,L]
</Directory>
