# Immich's SSD settings from immich-app/base-images postgres/postgresql.ssd.conf,
# plus the settings this single-container image needs. Put local changes in
# postgresql.override.conf inside the data folder; it is read last.
include_if_exists '/var/lib/postgresql/data/postgresql.conf'

listen_addresses = '127.0.0.1'
port = 5432
unix_socket_directories = '/run/postgresql'
# Docker gives the container 64 MB of /dev/shm and the panel cannot raise it,
# so parallel queries use System V shared memory instead of /dev/shm.
dynamic_shared_memory_type = sysv

shared_preload_libraries = 'vchord.so'
search_path = '"$user", public'
max_wal_size = 5GB
shared_buffers = 512MB
wal_compression = on
work_mem = 16MB
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_limit = 1000
effective_io_concurrency = 200
random_page_cost = 1.2

include_if_exists '/var/lib/postgresql/data/postgresql.override.conf'
